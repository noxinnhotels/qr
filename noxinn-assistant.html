<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5BB8F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Noxinn Deluxe Hotel — Konuk Asistanı</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}

#screen-welcome,#screen-chat{
  position:absolute;inset:0;width:100%;height:100%;
  transition:opacity .4s ease,transform .4s ease;
}
#screen-chat{opacity:0;pointer-events:none;transform:translateY(30px)}
body.chat-mode #screen-welcome{opacity:0;pointer-events:none;transform:translateY(-20px)}
body.chat-mode #screen-chat{opacity:1;pointer-events:all;transform:translateY(0)}

/* WELCOME */
.scene{
  width:100%;height:100%;
  background:linear-gradient(180deg,#4AA8E0 0%,#87CEEB 36%,#A8DFF8 41%,#5BB8F0 43%,#3A9BD5 46%,#E8C46A 46%,#D4A843 60%,#C49030 100%);
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;position:relative;
}
.sun{position:absolute;top:5%;right:12%;width:clamp(44px,12vw,70px);height:clamp(44px,12vw,70px);background:#FFD700;border-radius:50%;animation:sunP 3s ease-in-out infinite}
@keyframes sunP{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ray{position:absolute;width:5px;height:14px;background:#FFD700;border-radius:3px;top:50%;left:50%;transform-origin:2.5px -26px}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.88}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.c1{width:clamp(50px,15vw,80px);height:clamp(18px,5vw,26px);top:8%;left:5%;animation:cd 20s linear infinite}
.c1::before{width:34px;height:34px;top:-15px;left:8px}.c1::after{width:26px;height:26px;top:-11px;left:30px}
.c2{width:clamp(40px,11vw,60px);height:clamp(14px,4vw,20px);top:16%;left:38%;animation:cd 28s linear infinite 7s}
.c2::before{width:26px;height:26px;top:-12px;left:6px}.c2::after{width:20px;height:20px;top:-9px;left:22px}
@keyframes cd{from{transform:translateX(-140px)}to{transform:translateX(110vw)}}
.wave-wrap{position:absolute;top:43%;width:100%;height:22px;overflow:hidden;z-index:1}
.wave{width:200%;height:22px;background:#3A9BD5;border-radius:50%;animation:wv 2.8s ease-in-out infinite}
@keyframes wv{0%,100%{transform:translateX(0) scaleY(1)}50%{transform:translateX(-4%) scaleY(.75)}}
.palm-l{position:absolute;left:0;top:38%;transform:translateY(-50%);z-index:2}
.palm-r{position:absolute;right:0;top:38%;transform:translateY(-50%) scaleX(-1);z-index:2}

.robot-area{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  margin-top:clamp(70px,20vw,120px);
  animation:fl 2.6s ease-in-out infinite;
  flex:1;justify-content:center;
}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.bubble{
  background:#fff;border-radius:14px;
  padding:clamp(8px,2vw,11px) clamp(14px,4vw,20px);
  font-size:clamp(13px,3.8vw,16px);font-weight:600;color:#185FA5;
  border:2px solid #B5D4F4;margin-bottom:10px;text-align:center;
  max-width:min(290px,82vw);transition:opacity .3s;line-height:1.4;
  position:relative;
}
.bubble::after{content:'';display:block;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:11px solid #B5D4F4;margin:5px auto 0}
.robot-svg{display:block;margin:0 auto;width:clamp(110px,34vw,160px);height:auto}
.shadow{width:80px;height:12px;background:rgba(0,0,0,.15);border-radius:50%;margin:2px auto 0;animation:sh 2.6s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.15}50%{transform:scaleX(.6);opacity:.08}}

.bottom{z-index:10;text-align:center;padding:16px 20px 32px;width:100%}
.hotel-label{font-size:clamp(10px,2.5vw,12px);font-weight:600;color:#0C447C;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.btn-start{
  display:inline-block;padding:clamp(12px,3.5vw,15px) clamp(32px,9vw,48px);
  background:#185FA5;color:#fff;border:none;border-radius:32px;
  font-size:clamp(14px,4.2vw,17px);font-weight:600;cursor:pointer;
  transition:transform .12s,background .15s;
  box-shadow:0 4px 16px rgba(24,95,165,.35);
}
.btn-start:active{transform:scale(.96);background:#0C447C}
.hint{font-size:clamp(10px,2.8vw,12px);color:#444;margin-top:8px;opacity:.7;animation:fio 2.2s ease-in-out infinite}
@keyframes fio{0%,100%{opacity:.35}50%{opacity:.8}}

/* CHAT SCREEN */
#screen-chat{display:flex;flex-direction:column;background:#F0F4F8}
.chat-header{
  background:#185FA5;color:#fff;
  padding:clamp(12px,4vw,16px) 16px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  padding-top:max(clamp(12px,4vw,16px),env(safe-area-inset-top));
}
.chat-header-avatar{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.chat-header-info{flex:1}
.chat-header-name{font-size:15px;font-weight:600;line-height:1.2}
.chat-header-sub{font-size:11px;opacity:.8}
.btn-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px 4px 0;display:flex;align-items:center}
.lang-bar{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid #E0E8F0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.lang-bar::-webkit-scrollbar{display:none}
.lang-btn{flex-shrink:0;font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #C0D4E8;background:transparent;color:#666;cursor:pointer;font-weight:500;transition:all .15s}
.lang-btn.active{background:#185FA5;color:#fff;border-color:#185FA5}

.chat-window{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.user{align-self:flex-end;background:#185FA5;color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#fff;color:#222;border:1px solid #E0E8F0;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.msg.bot .sender{font-size:10px;color:#888;font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.typing{display:flex;gap:5px;align-items:center;padding:12px 14px}
.dot{width:7px;height:7px;border-radius:50%;background:#AAB8C8;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.quick-wrap{padding:8px 12px 4px;background:#fff;border-top:1px solid #E8EEF4;overflow-x:auto;display:flex;gap:7px;scrollbar-width:none;flex-shrink:0}
.quick-wrap::-webkit-scrollbar{display:none}
.quick-btn{flex-shrink:0;font-size:12px;padding:7px 13px;border-radius:20px;border:1px solid #C0D4E8;background:#F5F8FB;color:#333;cursor:pointer;white-space:nowrap;transition:background .12s}
.quick-btn:active{background:#E0ECFA}

.input-bar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid #E0E8F0;flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom));align-items:center}
.input-bar input{flex:1;font-size:15px;padding:10px 14px;border-radius:22px;border:1.5px solid #C0D4E8;background:#F5F8FB;color:#222;outline:none;transition:border-color .15s}
.input-bar input:focus{border-color:#185FA5;background:#fff}
.mic-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid #C0D4E8;background:#F5F8FB;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;transition:all .15s}
.mic-btn.on{background:#FFE8E8;border-color:#E24B4A;color:#E24B4A;animation:micpulse 1.1s infinite}
@keyframes micpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.send-btn{width:42px;height:42px;border-radius:50%;border:none;background:#185FA5;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:transform .12s,background .12s}
.send-btn:active{transform:scale(.93);background:#0C447C}
.status-txt{text-align:center;font-size:11px;color:#AAB8C8;padding:3px 0;min-height:18px;flex-shrink:0}
</style>
</head>

},3000);

function openChat(){
  document.body.classList.add('chat-mode');
  if(!messages.length){
    addMsg('bot',currentLang==='tr'?'Merhaba! Noxinn Deluxe Hotel\'e hoş geldiniz. Size nasıl yardımcı olabilirim?':'Hello! Welcome to Noxinn Deluxe Hotel. How can I help you today?');
  }
}
function closeChat(){document.body.classList.remove('chat-mode')}

function setLang(lang){
  currentLang=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  document.getElementById('userInput').placeholder=PLACEHOLDERS[lang];
  if(recognition)recognition.lang=LANG_CODES[lang];
  renderQuick();
}
function renderQuick(){
  document.getElementById('quickWrap').innerHTML=QUICK[currentLang].map(q=>`<button class="quick-btn" onclick="sendQuick('${q}')">${q}</button>`).join('');
}

function addMsg(role,text){
  const chat=document.getElementById('chat');
  const div=document.createElement('div');
  div.className='msg '+(role==='bot'?'bot':'user');
  if(role==='bot')div.innerHTML=`<div class="sender">Noxinn Asistan</div>${text}`;
  else div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}
function showTyping(){
  const chat=document.getElementById('chat');
  const div=document.createElement('div');
  div.className='msg bot';div.id='typing';
  div.innerHTML='<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove()}

async function callGroq(text){
  messages.push({role:'user',content:text});
  showTyping();
  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body:JSON.stringify({model:GROQ_MODEL,messages:[{role:'system',content:SYSTEM},...messages],max_tokens:512,temperature:0.7})
    });
    const data=await res.json();
    removeTyping();
    const reply=data.choices?.[0]?.message?.content||'Bir hata oluştu, lütfen tekrar deneyin.';
    messages.push({role:'assistant',content:reply});
    addMsg('bot',reply);speak(reply);
  }catch(e){removeTyping();addMsg('bot','Bağlantı hatası. Lütfen tekrar deneyin.')}
}

function sendMsg(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text)return;
  input.value='';addMsg('user',text);callGroq(text);
}
function sendQuick(text){addMsg('user',text);callGroq(text)}

function speak(text){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang=LANG_CODES[currentLang];u.rate=0.95;
  window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
}

function toggleMic(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    document.getElementById('statusTxt').textContent='Tarayıcınız mikrofonu desteklemiyor.';return;
  }
  if(isListening){recognition.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang=LANG_CODES[currentLang];recognition.interimResults=true;
  recognition.onstart=()=>{isListening=true;document.getElementById('micBtn').classList.add('on');document.getElementById('statusTxt').textContent='Dinleniyor...'};
  recognition.onresult=e=>{document.getElementById('userInput').value=Array.from(e.results).map(r=>r[0].transcript).join('')};
  recognition.onend=()=>{
    isListening=false;document.getElementById('micBtn').classList.remove('on');document.getElementById('statusTxt').textContent='';
    const val=document.getElementById('userInput').value.trim();if(val)sendMsg();
  };
  recognition.onerror=e=>{
    isListening=false;document.getElementById('micBtn').classList.remove('on');
    document.getElementById('statusTxt').textContent=e.error==='not-allowed'?'Mikrofon izni gerekli.':'Ses tanıma hatası.';
  };
  recognition.start();
}

// Auto-detect device language
(function(){
  const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  const map = [
    ['tr', 'tr'],
    ['ru', 'ru'],
    ['de', 'de'],
    ['pl', 'pl'],
    ['cs', 'cs'], ['cz', 'cs'],
    ['en', 'en']
  ];
  const detected = (map.find(([prefix]) => nav.startsWith(prefix)) || ['en','en'])[1];
  setLang(detected);
})();
</script>
